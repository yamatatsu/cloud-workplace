version: "1.3.5"
cache: true

interface:
  modelSelect: true
  webSearch: true

modelSpecs:
  list:
    - name: "fireworks-firerouter"
      label: "FireRouter"
      webSearch: true
      preset:
        endpoint: "Fireworks"
        model: "firerouter/kimi-k3/glm-5p3/deepseek-v4-flash-0731"
        maxContextTokens: 1000000

endpoints:
  custom:
    - name: "Fireworks"
      apiKey: "${FIREWORKS_API_KEY}"
      baseURL: "https://api.fireworks.ai/inference/v1"
      headers:
        # x-routing-preference: 1(品質最優先)〜5(コスト最優先)、省略時は3(balanced)
        x-routing-preference: "3"
      models:
        default:
          - "accounts/fireworks/routers/kimi-k3"
        fetch: true
      titleConvo: true
      titleModel: "accounts/fireworks/models/deepseek-v4-flash-0731"
      summarize: true
      summaryModel: "accounts/fireworks/models/deepseek-v4-flash-0731"
      modelDisplayLabel: "Fireworks"
      dropParams:
        - "user"

webSearch:
  searchProvider: "tavily"
  scraperProvider: "tavily"
  tavilyApiKey: "${TAVILY_API_KEY}"
  tavilySearchOptions:
    searchDepth: basic
    maxResults: 5
    topic: general
