version: "1.3.5"
cache: true

interface:
  modelSelect: true
  webSearch: true

modelSpecs:
  list:
    - name: "fireworks-firerouter"
      label: "FireRouter2"
      webSearch: true
      # このモデルスペック選択中は MHRise MCP を常に有効化する
      mcpServers:
        - "mhrise"
      preset:
        endpoint: "Fireworks"
        maxContextTokens: 1000000

        # FireRouter(model: Kimi K3/DeepSeek 4.1 Flash)
        # model: "firerouter/kimi-k3/deepseek-v4p1-flash"

        # DeepSeek 4.1 Flash
        model: "accounts/fireworks/models/deepseek-v4p1-flash"

endpoints:
  custom:
    - name: "Fireworks"
      apiKey: "${FIREWORKS_API_KEY}"
      baseURL: "https://api.fireworks.ai/inference/v1"
      headers:
        # x-routing-preference: 1(品質最優先)〜5(コスト最優先)、省略時は3(balanced)
        x-routing-preference: "4"
      models:
        default:
          - "FireRouter2"
        fetch: true
      titleConvo: true
      titleModel: "accounts/fireworks/models/deepseek-v4p1-flash"
      titlePrompt: |
        会話の内容に基づいて、簡潔なタイトルを日本語で生成してください。句読点や引用符は使わないでください。タイトルのみを出力し、「タイトル」という言葉や言語名は含めないでください。
        {convo}
      summarize: true
      summaryModel: "accounts/fireworks/models/deepseek-v4p1-flash"
      modelDisplayLabel: "Fireworks"
      dropParams:
        - "user"

webSearch:
  searchProvider: "tavily"
  scraperProvider: "tavily"
  tavilyApiKey: "${TAVILY_API_KEY}"
  tavilySearchOptions:
    searchDepth: basic
    maxResults: 5
    topic: general

mcpServers:
  mhrise:
    type: streamable-http
    url: http://mhrise-mcp:8000/mcp
    requiresOAuth: false
    timeout: 60000
    serverInstructions: true

mcpSettings:
  allowedAddresses:
    - "mhrise-mcp:8000"
